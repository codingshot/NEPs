name: spellchecker

on:
  pull_request:
    branches:
      - master

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: spellcheck.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  misspell:
    timeout-minutes: 60
    name: runner / misspell
    runs-on: ubuntu-latest
    steps:
      - name: Check out code.
        uses: actions/checkout@v1
      - name: misspell
        id: check_for_typos
        uses: reviewdog/action-misspell@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          path: "./specs"
          locale: "US"
